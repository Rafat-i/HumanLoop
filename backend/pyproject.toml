[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "humanloop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0.38,<2.1", "alembic>=1.14,<2", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3", "argon2-cffi>=25.1,<26", "httpx>=0.28,<1", "stripe>=12,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
markers = ["postgres: requires a real disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI dependency factories are evaluated intentionally.
